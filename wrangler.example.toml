name = "vervoersplanning-v2-backend"
main = "backend-worker.js"
compatibility_date = "2026-09-23"

# Version preview URLs keep older deploys reachable on their own hostname.
# Those older versions predate the operator key and would serve customer
# data without it, so previews stay off. This must stay above the first
# [section]: below [vars] it becomes a variable and does nothing.
preview_urls = false

# Replace the placeholder id after creating the KV namespace. Since the move to
# the Durable Object below it is only read once, to copy it over.
[[kv_namespaces]]
binding = "PLANNING_ORDERS"
id = "replace-with-kv-namespace-id"

# Everything is kept in one Durable Object with its own SQLite database (free
# plan: 5 million rows read and 100,000 written a day). KV above held it all
# before; on its first start the object copies KV over, and KV stays as it was.
[[durable_objects.bindings]]
name = "PLANNING_STORE"
class_name = "PlanningStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlanningStore"]

[vars]
CORS_ORIGIN = "https://specialistenplanning.pages.dev,https://bartvanengelenhoven.github.io"

# Set the webhook secret with:
# wrangler secret put SHOPIFY_WEBHOOK_SECRET


# The announcement at 16:00 Amsterdam time the day before a planned route.
# Cron runs in UTC: 14:00 is 16:00 in summer time, 15:00 in winter time. The
# worker checks which of the two it is and skips the other. The :10 run picks up
# what the first could not finish. It stays a trial that only reports until
# AUTO_FULFILL is set to "aan".
[triggers]
crons = ["0 14,15 * * *", "10 14,15 * * *"]
