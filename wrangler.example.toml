name = "vervoersplanning-v2-backend"
main = "backend-worker.js"
compatibility_date = "2026-09-23"

# Version preview URLs keep older deploys reachable on their own hostname.
# Those older versions predate the operator key and would serve customer
# data without it, so previews stay off. This must stay above the first
# [section]: below [vars] it becomes a variable and does nothing.
preview_urls = false

# Replace the placeholder id after creating the KV namespace.
[[kv_namespaces]]
binding = "PLANNING_ORDERS"
id = "replace-with-kv-namespace-id"

[vars]
CORS_ORIGIN = "https://bartvanengelenhoven.github.io"

# Set the webhook secret with:
# wrangler secret put SHOPIFY_WEBHOOK_SECRET


# The announcement at 16:00 Amsterdam time the day before a planned route.
# Cron runs in UTC: 14:00 is 16:00 in summer time, 15:00 in winter time. The
# worker checks which of the two it is and skips the other. It stays a trial
# that only reports until AUTO_FULFILL is set to "aan".
[triggers]
crons = ["0 14,15 * * *"]
